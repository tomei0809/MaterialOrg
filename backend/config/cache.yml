default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 60.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

production:
  database: cache
  # Neon の無料プランは保存容量が 0.5GB のため、キャッシュの上限を小さくする
  store_options:
    max_size: <%= 64.megabytes %>
    namespace: <%= Rails.env %>
