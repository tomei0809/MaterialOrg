# Render の Blueprint：Rails API（Docker）と PostgreSQL をまとめて作る
# 使い方は docs/deployment.md の「2. Render」。仕様 https://render.com/docs/blueprint-spec
# Next.js は Vercel、添付ファイルは Amazon S3 に置く

databases:
  - name: materialorg-db
    databaseName: materialorg_production
    user: materialorg
    plan: 0.1c-256mb
    region: singapore
    postgresMajorVersion: "17"

services:
  - type: web
    name: materialorg-api
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # 最後の2語を「./bin/rails server」にすると、bin/docker-entrypoint が起動前に db:prepare を実行する。
    # Puma は Render が渡す $PORT で待ち受ける（Thruster は使わない）
    dockerCommand: ./bin/rails server
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      # cache・queue・cable の DB は、この URL の DB 名に _cache などを付けて自動で作る（config/database.yml）
      - key: DATABASE_URL
        fromDatabase:
          name: materialorg-db
          property: connectionString
      # backend/config/master.key の中身
      - key: RAILS_MASTER_KEY
        sync: false
      # S3（docs/deployment.md の「1. S3」で作った IAM ユーザーの鍵とバケット）
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: AWS_REGION
        value: ap-northeast-1
      # 受け付けるホスト名（例 materialorg-api.onrender.com）。カンマ区切りで複数可
      - key: APP_HOST
        sync: false
      # 添付ファイルの解析・削除と、ゴミ箱の自動削除のジョブを Puma の中で動かす
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: RAILS_LOG_LEVEL
        value: info
